<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My CD Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: top nav, main column of account cards + a summary sidebar; stacks to one column on phones. */
  :root{
    --red:#e31837; --stripe2:#012169; --brand:#012169; --link:#0052c2;
    --text:#2b2f36; --muted:#5f6672; --line:#e3e6eb; --bg:#f3f4f7; --card:#ffffff; --field:#ffffff; --field-line:#b8bec8;
    --btn-bg:#012169; --btn-fg:#ffffff; --track:#e6ebf3; --shadow:rgba(10,20,40,.12);
    --warn-bg:#fff4e5; --warn:#975400; --info-bg:#eaf1fb; --info:#0b4a9e; --due-bg:#fdecee; --due:#b0102a; --ok:#1a7f37;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --red:#ff4d63; --stripe2:#4a6fd6; --brand:#9db8ff; --link:#7fb0ff;
    --text:#e4e7ec; --muted:#9aa2ae; --line:#2d323c; --bg:#121419; --card:#1b1e25; --field:#14171d; --field-line:#3a404c;
    --btn-bg:#3f63c8; --btn-fg:#ffffff; --track:#2a3040; --shadow:rgba(0,0,0,.45);
    --warn-bg:#3a2a12; --warn:#ffc46b; --info-bg:#16263f; --info:#9cc2ff; --due-bg:#3d1820; --due:#ff8a9a; --ok:#5fd37f;
    color-scheme:dark }}
  :root[data-theme="dark"]{
    --red:#ff4d63; --stripe2:#4a6fd6; --brand:#9db8ff; --link:#7fb0ff;
    --text:#e4e7ec; --muted:#9aa2ae; --line:#2d323c; --bg:#121419; --card:#1b1e25; --field:#14171d; --field-line:#3a404c;
    --btn-bg:#3f63c8; --btn-fg:#ffffff; --track:#2a3040; --shadow:rgba(0,0,0,.45);
    --warn-bg:#3a2a12; --warn:#ffc46b; --info-bg:#16263f; --info:#9cc2ff; --due-bg:#3d1820; --due:#ff8a9a; --ok:#5fd37f;
    color-scheme:dark }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
  .gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .nav{max-width:1132px;margin:0 auto;padding-block:12px;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
  .brand{font-weight:700;color:var(--brand);font-size:18px;margin-right:8px}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .nav a{color:var(--text);text-decoration:none;font-size:14px;padding:6px 0;border-bottom:2px solid transparent}
  .nav a.active{color:var(--brand);font-weight:600;border-color:var(--red)}
  .nav .spacer{flex:1}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--link);outline-offset:2px}
  .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
  .btn{background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-bg);border-radius:4px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
  .btn:hover{opacity:.9}
  .btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand)}
  .btn.danger{background:var(--due);border-color:var(--due);color:var(--card)}
  .btn.small{padding:6px 12px;font-size:13px}
  main{max-width:1132px;margin:0 auto;padding-block:20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}
  main.wide{grid-template-columns:minmax(0,1fr)}
  @media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
  section,aside{min-width:0}
  h1{font-size:20px;margin:6px 0 14px;font-weight:600;text-wrap:balance}
  .card{background:var(--card);border-radius:6px;box-shadow:0 1px 4px var(--shadow);margin-bottom:20px;overflow:hidden}
  .card::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--red) 50%,var(--stripe2) 50%)}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px}
  .card-head h2{margin:0;font-size:19px;font-weight:500;min-width:0;overflow-wrap:anywhere}
  .card-head h2 a{color:inherit;text-decoration:none}
  .card-head .amt{font-size:19px;font-weight:600;white-space:nowrap}
  .group{padding:0 20px 8px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row > span:first-child{min-width:0}
  .row a{color:var(--link);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
  .row:hover a{text-decoration:underline}
  .row .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}
  .row .bal{white-space:nowrap;text-align:right}
  .card h3{margin:0;padding:16px 20px 6px;font-size:16px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 20px;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{text-align:right;overflow-wrap:anywhere}
  .kv a{color:var(--link);text-decoration:none}
  .kv.strong span{color:var(--text);font-weight:700}
  .back{display:inline-block;margin-bottom:12px;color:var(--link);text-decoration:none;font-size:14px}
  .back:hover{text-decoration:underline}
  .hero{padding:18px 20px 22px;border-bottom:1px solid var(--line)}
  .hero .label{color:var(--muted);font-size:13px}
  .hero .big{font-size:32px;font-weight:600;margin-top:4px}
  .hero .meta{margin-top:6px;font-size:13px;color:var(--muted)}
  .tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px;font:inherit;font-size:14px;cursor:pointer;color:var(--text);white-space:nowrap}
  .tabs button.on{border-color:var(--red);color:var(--brand);font-weight:600}
  .panel{padding:4px 0 10px}
  .bar{margin:10px 20px 4px;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--stripe2)}
  .note{font-size:12px;color:var(--muted);padding:8px 20px 14px;line-height:1.5}
  .alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:6px;margin-bottom:10px;font-size:14px;line-height:1.45}
  .alert b{display:block}
  .alert a{color:inherit;font-weight:600}
  .alert.due{background:var(--due-bg);color:var(--due)}
  .alert.warn{background:var(--warn-bg);color:var(--warn)}
  .alert.info{background:var(--info-bg);color:var(--info)}
  .alert .dot{width:10px;height:10px;border-radius:50%;background:currentColor;margin-top:5px;flex:none}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:1px;white-space:nowrap}
  .pill.due{background:var(--due-bg);color:var(--due)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.info{background:var(--info-bg);color:var(--info)}
  .tbl-wrap{overflow-x:auto;padding:0 20px 12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-weight:600;color:var(--muted);font-size:13px}
  tfoot td{font-weight:600;border-bottom:none}
  td a{color:var(--link);text-decoration:none}
  form.f{padding:12px 20px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
  form.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
  form.f .full{grid-column:1/-1}
  input,select,textarea{font:inherit;color:var(--text);background:var(--field);padding:8px 10px;border:1px solid var(--field-line);border-radius:4px;min-width:0}
  textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--due)}
  .msg{font-size:13px;color:var(--ok)}
  .err{font-size:13px;color:var(--due)}
  .empty{padding:14px 20px 18px;color:var(--muted);font-size:14px;line-height:1.5}
  .pad{padding:0 20px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:13px;box-shadow:0 2px 10px var(--shadow);max-width:calc(100% - 32px)}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:16px}
  .lock{width:100%;max-width:380px}
  .lock .inner{padding:24px 24px 26px}
  .lock h2{margin:0 0 4px;font-size:20px;color:var(--brand)}
  .lock p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .lock input{width:100%;margin-bottom:12px;padding:10px 12px}
  .lock .btn{width:100%}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="center gutter"><div class="card lock"><div class="inner"><h2>My CD Portfolio</h2><p>Loading your portfolio…</p></div></div></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ================= constants ================= */
const TYPES = {
  checking:  { label:"Checking",                liability:false },
  savings:   { label:"Savings",                 liability:false },
  cd:        { label:"Certificates of Deposit", liability:false },
  investment:{ label:"Investments",             liability:false },
  credit:    { label:"Credit cards",            liability:true  },
};
const ALERT_WARN_DAYS = 30, ALERT_INFO_DAYS = 60;
const DOC_PATH = "portfolio/main";
const LOCAL_KEY = "cdp.data";

/* ================= state + storage ================= */
// mode: "db" (claude.ai artifact database), "local" (this browser only)
let mode = null, docRef = null, data = null, lastSaved = "", loadTimer = null, loadNote = "";
const tabState = {};

const emptyData = () => ({ cds: [], accounts: [], renewals: [], pwHash: null });
function normalize(o){
  o = (o && typeof o === "object") ? JSON.parse(JSON.stringify(o)) : {};
  return { cds: Array.isArray(o.cds) ? o.cds : [], accounts: Array.isArray(o.accounts) ? o.accounts : [],
           renewals: Array.isArray(o.renewals) ? o.renewals : [], pwHash: o.pwHash || null };
}
const lsGet = (k, s) => { try{ return JSON.parse((s||localStorage).getItem(k)); }catch(e){ return null; } };
const lsSet = (k, v, s) => { try{ (s||localStorage).setItem(k, JSON.stringify(v)); }catch(e){} };
const lsDel = (k, s) => { try{ (s||localStorage).removeItem(k); }catch(e){} };
let ss = null; try{ ss = window.sessionStorage; }catch(e){}

let writing = false, dirty = false;
async function save(){
  lastSaved = JSON.stringify(data);
  if (mode === "local"){ lsSet(LOCAL_KEY, data); return; }
  if (writing){ dirty = true; return; }
  writing = true;
  do {
    dirty = false;
    try { await docRef.set(JSON.parse(JSON.stringify(data))); }
    catch(e){
      if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 800 + Math.random()*800)); dirty = true; }
      else if (e && e.code === "quota_exceeded"){ toast("Storage is full. Delete some records and try again."); }
      else { toast("Changes could not be saved. You may not have edit access to this page."); }
    }
  } while (dirty);
  writing = false;
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 4000);
}

async function boot(){
  let db = null;
  if (window.claude && typeof window.claude.use === "function"){
    try { db = await window.claude.use("db"); } catch(e){ db = null; }
  }
  if (db){
    mode = "db";
    docRef = db.doc(DOC_PATH);
    loadTimer = setTimeout(()=>{
      loadNote = "Your saved data can't be reached right now. Changes may not be up to date.";
      if (!data){ data = emptyData(); }
      render();
    }, 10000);
    docRef.onSnapshot(snap => {
      const incoming = normalize(snap.exists ? snap.data() : null);
      if (!snap.metadata.fromCache){ clearTimeout(loadTimer); loadNote = ""; }
      const s = JSON.stringify(incoming);
      if (data && s === JSON.stringify(data)) return;
      if (data && s === lastSaved) return;
      data = incoming;
      const ae = document.activeElement;
      if (ae && ae.closest && ae.closest("form") && unlocked()) { render.pending = true; return; }
      render();
    }, err => {
      clearTimeout(loadTimer);
      loadNote = "Your saved data is not available in this view.";
      if (!data) data = emptyData();
      render();
    });
  } else {
    mode = "local";
    data = normalize(lsGet(LOCAL_KEY));
    const oldPw = lsGet("cdp.pw");
    if (!data.pwHash && oldPw){ data.pwHash = oldPw; lsSet(LOCAL_KEY, data); }
    if (!Array.isArray((lsGet(LOCAL_KEY)||{}).accounts) && lsGet(LOCAL_KEY)) lsSet(LOCAL_KEY, data);
    render();
  }
}

/* ================= helpers ================= */
const usd = n => (+n||0).toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2});
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const fmtDate = s => { if(!s) return "—"; const d = parse(s); return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}/${d.getFullYear()}`; };
const isoToday = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };
const today = () => parse(isoToday());
const daysLeft = s => Math.round((parse(s) - today())/86400000);
const title = c => `${c.bank || "CD"} CD (${c.tag ? c.tag + "; " : ""}${(+c.apy).toFixed(2)}%; ${fmtDate(c.maturity)})`;
const annualInt = c => c.balance * c.apy / 100;
const intToMaturity = c => c.balance * (c.apy/100) * Math.max(0,daysLeft(c.maturity)) / 365;
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const cdTotal = () => data.cds.reduce((a,c)=>a+c.balance,0);
const byMaturity = () => [...data.cds].sort((a,b)=>parse(a.maturity)-parse(b.maturity));
const wApy = list => { const t = list.reduce((a,c)=>a+c.balance,0); return t ? list.reduce((a,c)=>a+c.apy*c.balance,0)/t : 0; };

function status(c){
  const d = daysLeft(c.maturity);
  if (d <= 0)               return { level:"due",  text: d===0 ? "Matures today" : `Matured ${-d} day${-d===1?"":"s"} ago` };
  if (d <= ALERT_WARN_DAYS) return { level:"warn", text:`Matures in ${d} day${d===1?"":"s"}` };
  if (d <= ALERT_INFO_DAYS) return { level:"info", text:`Matures in ${d} days` };
  return null;
}
const alerts = () => byMaturity().map(c=>({c, s:status(c)})).filter(x=>x.s);
function groupTotal(type){
  return data.accounts.filter(a=>a.type===type).reduce((s,a)=>s+a.balance,0) + (type==="cd" ? cdTotal() : 0);
}

/* ================= password lock ================= */
async function hash(pw){
  const salted = "cdp:" + pw;
  if (window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salted));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let h = 2166136261; for (const ch of salted){ h ^= ch.charCodeAt(0); h = Math.imul(h,16777619); } return "f" + (h>>>0).toString(16);
}
const unlocked = () => ss ? lsGet("cdp.unlocked", ss) === true : window.__unlocked === true;
const setUnlocked = v => { window.__unlocked = v; if (ss){ v ? lsSet("cdp.unlocked", true, ss) : lsDel("cdp.unlocked", ss); } };

function lockView(){
  const first = !data.pwHash;
  return `
  <div class="center gutter"><div class="card lock"><div class="inner">
    <h2>My CD Portfolio</h2>
    <p>${first ? "Create a password to protect this page." : "Enter your password to continue."}</p>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="pw1" placeholder="Password" aria-label="Password" required autofocus>
      ${first ? `<input type="password" id="pw2" placeholder="Confirm password" aria-label="Confirm password" required>` : ""}
      <button class="btn" type="submit">${first ? "Set password" : "Unlock"}</button>
      <div class="err" id="lockErr" style="margin-top:10px"></div>
    </form>
  </div></div></div>`;
}
function bindLock(){
  document.getElementById("lockForm").onsubmit = async e => {
    e.preventDefault();
    const pw1 = document.getElementById("pw1").value, pw2el = document.getElementById("pw2");
    const err = document.getElementById("lockErr");
    if (pw2el){
      if (pw1.length < 4) return err.textContent = "Use at least 4 characters.";
      if (pw1 !== pw2el.value) return err.textContent = "Passwords do not match.";
      data.pwHash = await hash(pw1); save();
    } else if (await hash(pw1) !== data.pwHash){
      return err.textContent = "Incorrect password.";
    }
    setUnlocked(true); render();
  };
}

/* ================= inline confirm (dialogs are blocked in the viewer) ================= */
function confirmInline(btn, text, yesLabel, onYes){
  if (btn.nextElementSibling && btn.nextElementSibling.classList.contains("confirm")) return;
  const box = document.createElement("span");
  box.className = "confirm";
  box.innerHTML = `<span>${esc(text)}</span><button type="button" class="btn small danger">${esc(yesLabel)}</button><button type="button" class="btn ghost small">Cancel</button>`;
  btn.hidden = true; btn.after(box);
  const [yes, no] = box.querySelectorAll("button");
  no.onclick = () => { box.remove(); btn.hidden = false; btn.focus(); };
  yes.onclick = onYes;
  yes.focus();
}

/* ================= layout ================= */
function shell(route, body, wide){
  const n = alerts().length;
  const link = (h, label, key) => `<a href="#${h}" class="${route===key?"active":""}">${label}</a>`;
  return `
  <header class="gutter"><div class="nav">
    <div class="brand">My CD Portfolio<small>Personal CD tracker</small></div>
    ${link("overview","Overview","overview")}
    ${link("cds","CDs","cds")}
    ${link("alerts",`Alerts${n?`<span class="badge">${n}</span>`:""}`,"alerts")}
    ${link("interest","Interest","interest")}
    ${link("renewals","Renewals","renewals")}
    ${link("preferences","Preferences","preferences")}
    <span class="spacer"></span>
    <button class="btn ghost small" id="lockBtn" type="button">Lock</button>
  </div></header>
  <main class="gutter ${wide?"wide":""}">${loadNote?`<div class="alert warn" style="grid-column:1/-1;margin:0"><span class="dot"></span><span>${esc(loadNote)}</span></div>`:""}${body}</main>`;
}

function alertBox(list, compact){
  return list.map(({c,s})=>`
    <div class="alert ${s.level}"><span class="dot"></span><span>
      <b>${s.text}</b>
      <a href="#cd-${c.id}">${esc(title(c))}</a> · ${usd(c.balance)}
      ${compact ? "" : `<br>${s.level==="due" ? "Record the renewal or withdrawal for this CD." : "Decide whether to renew or withdraw before the maturity date."}`}
    </span></div>`).join("");
}
const typeOptions = sel => Object.keys(TYPES).map(k=>`<option value="${k}" ${k===sel?"selected":""}>${TYPES[k].label}</option>`).join("");

/* ================= views ================= */
function overviewView(){
  const types = Object.keys(TYPES);
  const assets = types.filter(k=>!TYPES[k].liability).reduce((s,k)=>s+groupTotal(k),0);
  const liab = types.filter(k=>TYPES[k].liability).reduce((s,k)=>s+groupTotal(k),0);
  const acctRow = a => `
    <div class="row" tabindex="0" data-go="acct-${a.id}">
      <span><a href="#acct-${a.id}">${esc(a.name)}</a>${a.institution?`<span class="sub">${esc(a.institution)}</span>`:""}</span>
      <span class="bal">${usd(a.balance)}</span>
    </div>`;
  const cards = types.map(k=>{
    const list = data.accounts.filter(a=>a.type===k);
    if (k==="cd" ? (!list.length && !data.cds.length) : !list.length) return "";
    const head = k==="cd"
      ? `<div class="card-head"><h2><a href="#cds">${TYPES[k].label} ›</a></h2><span class="amt">${usd(groupTotal(k))}</span></div>`
      : `<div class="card-head"><h2>${TYPES[k].label}</h2><span class="amt">${usd(groupTotal(k))}</span></div>`;
    const tracked = (k==="cd" && data.cds.length) ? `
      <div class="row" tabindex="0" data-go="cds">
        <span><a href="#cds">Tracked CDs (${data.cds.length})</a><span class="sub">APY, maturity alerts, interest and renewals</span></span>
        <span class="bal">${usd(cdTotal())}</span>
      </div>` : "";
    return `<div class="card">${head}<div class="group">${tracked}${list.map(acctRow).join("")}</div></div>`;
  }).join("");
  return `
  <section>
    <h1>Overview</h1>

/* ================= router ================= */
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  let m;
  if ((m = h.match(/^cd-([\w-]+)$/))){ const c = data.cds.find(x=>x.id===m[1]); if (c) return { key:"cds", view:()=>cdDetailView(c), cd:c, tabKey:h }; }
  if ((m = h.match(/^acct-([\w-]+)$/))){ const a = data.accounts.find(x=>x.id===m[1]); if (a) return { key:"overview", view:()=>accountView(a), acct:a, tabKey:h }; }
  const map = { cds:[cdsView], alerts:[alertsView], interest:[interestView,true], renewals:[renewalsView,true], preferences:[preferencesView,true] };
  if (map[h]) return { key:h, view:map[h][0], wide:!!map[h][1] };
  return { key:"overview", view:overviewView };
}

function render(){
  render.pending = false;
  const root = document.getElementById("root");
  if (!data) return;
  if (!unlocked()){ root.innerHTML = lockView(); bindLock(); return; }

  const r = currentRoute();
  root.innerHTML = shell(r.key, r.view(), r.wide);

  document.getElementById("lockBtn").onclick = () => { setUnlocked(false); render(); };
  root.querySelectorAll("[data-go]").forEach(el=>{
    el.onclick = e => { if (e.target.closest("a")) return; location.hash = el.dataset.go; };
    el.onkeydown = e => { if (e.key === "Enter") location.hash = el.dataset.go; };
  });

  // tabs (remember the open tab per page so live updates don't reset it)
  const tabs = root.querySelectorAll(".tabs button");
  const showTab = t => {
    tabs.forEach(x=>{ const on = x.dataset.t===t; x.classList.toggle("on",on); x.setAttribute("aria-selected", on); });
    root.querySelectorAll(".panel").forEach(p=>p.hidden = p.id!=="p-"+t);
    if (r.tabKey) tabState[r.tabKey] = t;
  };
  tabs.forEach(b=>b.onclick=()=>showTab(b.dataset.t));
  if (tabs.length) showTab(tabState[r.tabKey] || "details");

  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; return el; };
  const fd = e => new FormData(e.target);

  on("addAcctForm","onsubmit", e => {
    e.preventDefault(); const f = fd(e);
    data.accounts.push({ id:newId("a"), type:f.get("type"), name:f.get("name").trim(), institution:f.get("institution").trim(),
      balance:+f.get("balance"), note:"", updated:isoToday() });
    save(); render(); toast("Account added.");
  });

  on("editAcctForm","onsubmit", e => {
    e.preventDefault(); const f = fd(e), a = r.acct, nb = +f.get("balance");
    if (nb !== a.balance){ (a.history ||= []).push({ date:isoToday(), from:a.balance, to:nb }); a.updated = isoToday(); }
    Object.assign(a, { name:f.get("name").trim(), type:f.get("type"), institution:f.get("institution").trim(), balance:nb, note:f.get("note").trim() });
    save(); tabState[r.tabKey] = "details"; render(); toast("Changes saved.");
  });
  on("delAcctBtn","onclick", e => confirmInline(e.currentTarget, `Delete "${r.acct.name}"?`, "Delete", () => {
    data.accounts = data.accounts.filter(a=>a!==r.acct); save(); location.hash = "overview"; toast("Account deleted.");
  }));

  const readCd = f => ({ bank:f.get("bank").trim(), tag:f.get("tag").trim(), apy:+f.get("apy"), maturity:f.get("maturity"), balance:+f.get("balance") });
  on("addCdForm","onsubmit", e => {
    e.preventDefault(); const c = { id:newId("cd"), ...readCd(fd(e)) };
    data.cds.push(c); save(); render(); toast("CD added.");
  });
  on("editCdForm","onsubmit", e => {
    e.preventDefault(); Object.assign(r.cd, readCd(fd(e)));
    save(); tabState[r.tabKey] = "details"; render(); toast("Changes saved.");
  });
  on("delCdBtn","onclick", e => confirmInline(e.currentTarget, "Delete this CD?", "Delete", () => {
    data.cds = data.cds.filter(c=>c!==r.cd); save(); location.hash = "cds"; toast("CD deleted.");
  }));

  on("renewForm","onsubmit", e => {
    e.preventDefault(); const c = r.cd, f = fd(e), msg = document.getElementById("renewMsg");
    const newMat = f.get("maturity");
    if (parse(newMat) <= parse(f.get("date"))){ msg.className="err"; msg.textContent="New maturity must be after the renewal date."; return; }
    data.renewals.push({ cdId:c.id, date:f.get("date"), oldApy:c.apy, newApy:+f.get("apy"),
      oldMaturity:c.maturity, newMaturity:newMat, oldBalance:c.balance, newBalance:+f.get("balance"), note:f.get("note").trim() });
    Object.assign(c, { apy:+f.get("apy"), maturity:newMat, balance:+f.get("balance") });
    save(); tabState[r.tabKey] = "history"; render(); toast("Renewal saved.");
  });

  on("pwForm","onsubmit", async e => {
    e.preventDefault(); const f = fd(e), msg = document.getElementById("pwMsg");
    msg.className = "err";
    if (await hash(f.get("cur")) !== data.pwHash) return msg.textContent = "Current password is incorrect.";
    if (f.get("n1").length < 4) return msg.textContent = "Use at least 4 characters.";
    if (f.get("n1") !== f.get("n2")) return msg.textContent = "New passwords do not match.";
    data.pwHash = await hash(f.get("n1")); save();
    e.target.reset(); msg.className = "msg"; msg.textContent = "Password updated.";
  });

  const backupJson = () => JSON.stringify({ cds:data.cds, accounts:data.accounts, renewals:data.renewals }, null, 2);
  on("exportBtn","onclick", async () => {
    const msg = document.getElementById("bkMsg"), filename = `cd-portfolio-${isoToday()}.json`;
    let dl = null;
    if (window.claude && window.claude.use){ try{ dl = await window.claude.use("downloads"); }catch(e){} }
    if (dl){
      try { await dl.save({ filename, data: backupJson() }); msg.className="msg"; msg.textContent="Backup saved."; }
      catch(err){ msg.className="err"; msg.textContent = err && err.code==="declined" ? "Download cancelled." : "Download is not available here. Use Copy backup instead."; }
      return;
    }
    if (mode === "local"){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([backupJson()],{type:"application/json"}));
      a.download = filename; a.click(); return;
    }
    msg.className="err"; msg.textContent="Download is not available here. Use Copy backup instead.";
  });
  on("copyBtn","onclick", () => {
    const msg = document.getElementById("bkMsg");
    navigator.clipboard.writeText(backupJson()).then(
      () => { msg.className="msg"; msg.textContent="Backup copied to clipboard."; },
      () => { const ta = document.getElementById("imp-json"); ta.value = backupJson(); ta.focus(); ta.select();
              msg.className="err"; msg.textContent="Clipboard blocked. The backup is selected in the Restore box below; copy it from there."; });
  });
  on("importForm","onsubmit", e => {
    e.preventDefault(); const msg = document.getElementById("impMsg");
    let parsed;
    try { parsed = normalize(JSON.parse(document.getElementById("imp-json").value)); }
    catch(err){ msg.className="err"; msg.textContent="That text is not valid JSON."; return; }
    const btn = document.getElementById("importBtn");
    confirmInline(btn, `Replace current data with ${parsed.accounts.length} accounts and ${parsed.cds.length} CDs?`, "Replace", () => {
      Object.assign(data, { cds:parsed.cds, accounts:parsed.accounts, renewals:parsed.renewals });
      save(); location.hash = "overview"; render(); toast("Backup restored.");
    });
  });
  on("clearBtn","onclick", e => confirmInline(e.currentTarget, "Delete all accounts, CDs and history?", "Clear all", () => {
    Object.assign(data, { cds:[], accounts:[], renewals:[] }); save(); location.hash = "overview"; render(); toast("All data cleared.");
  }));

  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
document.addEventListener("focusout", () => setTimeout(()=>{ if (render.pending && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("form"))) render(); }, 0));
boot();
</script>
</body>
</html>
